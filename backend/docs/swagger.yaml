basePath: /
definitions:
  dto.ArchiveCampaignResponse:
    properties:
      campaign:
        $ref: '#/definitions/dto.CampaignResponse'
      message:
        example: кампания архивирована
        type: string
    type: object
  dto.ArchiveClientResponse:
    properties:
      client:
        $ref: '#/definitions/dto.ClientResponse'
      message:
        example: клиент архивирован
        type: string
    type: object
  dto.ArchiveSegmentResponse:
    properties:
      message:
        example: сегмент архивирован
        type: string
      segment:
        $ref: '#/definitions/dto.SegmentResponse'
    type: object
  dto.ArchiveTemplateResponse:
    properties:
      message:
        example: шаблон архивирован
        type: string
      template:
        $ref: '#/definitions/dto.TemplateResponse'
    type: object
  dto.ArchiveUserResponse:
    properties:
      message:
        example: пользователь архивирован
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.CampaignResponse:
    properties:
      camp_id:
        example: 1
        type: integer
      created_at:
        example: "2023-10-10T10:00:00Z"
        type: string
      created_by:
        example: 2
        type: integer
      deleted_at:
        example: "2024-06-01T12:00:00Z"
        type: string
      deleted_by:
        example: 2
        type: integer
      is_deleted:
        example: false
        type: boolean
      scheduled_at:
        example: "2023-10-10T10:00:00Z"
        type: string
      segment:
        example: sport
        type: string
      status:
        example: scheduled
        type: string
      tpl_id:
        example: 1
        type: integer
    type: object
  dto.ClientResponse:
    properties:
      client_id:
        example: 1
        type: integer
      consent_flag:
        example: true
        type: boolean
      created_at:
        example: "2024-06-01T12:00:00Z"
        type: string
      deleted_at:
        example: "2024-06-01T12:00:00Z"
        type: string
      deleted_by:
        example: 2
        type: integer
      email:
        example: mirea@mail.ru
        type: string
      is_deleted:
        example: false
        type: boolean
      segment:
        example: sport
        type: string
      updated_at:
        example: "2026-11-05T12:00:00Z"
        type: string
    type: object
  dto.CreateCampaignRequest:
    properties:
      scheduled_at:
        example: "2023-10-10T10:00:00Z"
        type: string
      segment:
        example: sport
        type: string
      tpl_id:
        example: 1
        type: integer
    required:
    - scheduled_at
    - segment
    - tpl_id
    type: object
  dto.CreateCampaignResponse:
    properties:
      campaign:
        $ref: '#/definitions/dto.CampaignResponse'
      message:
        example: кампания создана
        type: string
    type: object
  dto.CreateClientRequest:
    properties:
      consent_flag:
        example: true
        type: boolean
      email:
        example: mirea@mail.ru
        type: string
      segment:
        example: sport
        type: string
    required:
    - email
    - segment
    type: object
  dto.CreateClientResponse:
    properties:
      client:
        $ref: '#/definitions/dto.ClientResponse'
      message:
        example: клиент создан
        type: string
    type: object
  dto.CreateSegmentRequest:
    properties:
      description:
        example: VIP клиенты
        type: string
      name:
        example: VIP
        type: string
    required:
    - description
    - name
    type: object
  dto.CreateSegmentResponse:
    properties:
      message:
        example: сегмент создан
        type: string
      segment:
        $ref: '#/definitions/dto.SegmentResponse'
    type: object
  dto.CreateTemplateRequest:
    properties:
      html_body:
        example: <h1>Hello</h1>
        type: string
      name:
        example: Welcome template
        type: string
    required:
    - html_body
    - name
    type: object
  dto.CreateTemplateResponse:
    properties:
      message:
        example: шаблон создан
        type: string
      template:
        $ref: '#/definitions/dto.TemplateResponse'
    type: object
  dto.GetAllCampaignsResponse:
    properties:
      campaigns:
        items:
          $ref: '#/definitions/dto.CampaignResponse'
        type: array
    type: object
  dto.GetAllClientsResponse:
    properties:
      clients:
        items:
          $ref: '#/definitions/dto.ClientResponse'
        type: array
    type: object
  dto.GetAllSegmentsResponse:
    properties:
      segments:
        items:
          $ref: '#/definitions/dto.SegmentResponse'
        type: array
    type: object
  dto.GetAllTemplatesResponse:
    properties:
      templates:
        items:
          $ref: '#/definitions/dto.TemplateResponse'
        type: array
    type: object
  dto.GetAllUsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/dto.UserResponse'
        type: array
    type: object
  dto.GetPendingTemplatesResponse:
    properties:
      templates:
        items:
          $ref: '#/definitions/dto.TemplateResponse'
        type: array
    type: object
  dto.GetTemplateByIDResponse:
    properties:
      template:
        $ref: '#/definitions/dto.TemplateResponse'
    type: object
  dto.GetTemplateReviewsResponse:
    properties:
      reviews:
        items:
          $ref: '#/definitions/dto.TemplateReviewResponse'
        type: array
    type: object
  dto.GetTemplatesByUserIDResponse:
    properties:
      templates:
        items:
          $ref: '#/definitions/dto.TemplateResponse'
        type: array
    type: object
  dto.LoginRequest:
    properties:
      login:
        example: user123
        type: string
      password:
        example: pass123
        type: string
    required:
    - login
    - password
    type: object
  dto.LoginResponse:
    properties:
      message:
        example: успешный вход
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      login:
        example: user123
        type: string
      password:
        example: pass123
        type: string
      role:
        enum:
        - marketer
        - analyst
        - admin
        example: marketer
        type: string
    required:
    - login
    - password
    - role
    type: object
  dto.RegisterResponse:
    properties:
      login:
        example: user123
        type: string
      message:
        example: пользователь создан
        type: string
      role:
        example: marketer
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  dto.RejectTemplateRequest:
    properties:
      comment:
        type: string
    required:
    - comment
    type: object
  dto.RestoreCampaignResponse:
    properties:
      campaign:
        $ref: '#/definitions/dto.CampaignResponse'
      message:
        example: кампания восстановлена
        type: string
    type: object
  dto.RestoreClientResponse:
    properties:
      client:
        $ref: '#/definitions/dto.ClientResponse'
      message:
        example: клиент восстановлен
        type: string
    type: object
  dto.RestoreSegmentResponse:
    properties:
      message:
        example: сегмент восстановлен
        type: string
      segment:
        $ref: '#/definitions/dto.SegmentResponse'
    type: object
  dto.RestoreTemplateResponse:
    properties:
      message:
        example: шаблон восстановлен
        type: string
      template:
        $ref: '#/definitions/dto.TemplateResponse'
    type: object
  dto.RestoreUserResponse:
    properties:
      message:
        example: пользователь восстановлен
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.SegmentResponse:
    properties:
      description:
        example: VIP клиенты
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: VIP
        type: string
    type: object
  dto.TemplateResponse:
    properties:
      created_at:
        example: "2024-06-01T12:00:00Z"
        type: string
      created_by:
        example: 18
        type: integer
      deleted_at:
        example: "2024-06-01T12:00:00Z"
        type: string
      deleted_by:
        example: 2
        type: integer
      html_body:
        example: <h1>Hello</h1>
        type: string
      is_deleted:
        example: false
        type: boolean
      name:
        example: Welcome template
        type: string
      status:
        example: черновик
        type: string
      tpl_id:
        example: 1
        type: integer
      updated_at:
        example: "2024-06-01T12:00:00Z"
        type: string
      updated_by:
        example: 18
        type: integer
    type: object
  dto.TemplateReviewResponse:
    properties:
      admin_id:
        type: integer
      comment:
        type: string
      id:
        type: integer
      reviewed_at:
        type: string
      status:
        type: string
      tpl_id:
        type: integer
    type: object
  dto.UpdateCampaignRequest:
    properties:
      status:
        example: scheduled
        type: string
    required:
    - status
    type: object
  dto.UpdateClientRequest:
    properties:
      consent_flag:
        example: true
        type: boolean
      email:
        example: mirea@mail.ru
        type: string
      segment:
        example: sport
        type: string
    type: object
  dto.UpdateClientResponse:
    properties:
      client:
        $ref: '#/definitions/dto.ClientResponse'
      message:
        example: клиент обновлён
        type: string
    type: object
  dto.UpdateSegmentRequest:
    properties:
      description:
        type: string
    type: object
  dto.UpdateSegmentResponse:
    properties:
      message:
        example: сегмент обновлён
        type: string
      segment:
        $ref: '#/definitions/dto.SegmentResponse'
    type: object
  dto.UpdateTemplateRequest:
    properties:
      html_body:
        type: string
      name:
        type: string
    type: object
  dto.UpdateTemplateResponse:
    properties:
      message:
        example: шаблон обновлён
        type: string
      template:
        $ref: '#/definitions/dto.TemplateResponse'
    type: object
  dto.UpdateUserRequest:
    properties:
      login:
        type: string
      role:
        type: string
    type: object
  dto.UpdateUserResponse:
    properties:
      message:
        example: пользователь обновлён
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.UserResponse:
    properties:
      created_at:
        example: "2024-06-01T12:00:00Z"
        type: string
      deleted_at:
        example: "2024-06-01T12:00:00Z"
        type: string
      deleted_by:
        example: 2
        type: integer
      id:
        example: 1
        type: integer
      is_deleted:
        example: false
        type: boolean
      login:
        example: mirea@example.com
        type: string
      role:
        example: admin
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: API для конструктора email-рассылок
  title: Email Campaign API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Логин данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
      summary: Логин
      tags:
      - auth
  /api/campaigns:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetAllCampaignsResponse'
      summary: Получить все кампании
      tags:
      - campaigns
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные кампании
        in: body
        name: campaign
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCampaignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateCampaignResponse'
      summary: Создать кампанию
      tags:
      - campaigns
  /api/campaigns/{id}:
    get:
      parameters:
      - description: ID кампании
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CampaignResponse'
      summary: Получить кампанию по ID
      tags:
      - campaigns
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID кампании
        in: path
        name: id
        required: true
        type: integer
      - description: Новый статус кампании
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCampaignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CampaignResponse'
      summary: Обновить статус кампании
      tags:
      - campaigns
  /api/campaigns/{id}/archive:
    patch:
      parameters:
      - description: ID кампании
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArchiveCampaignResponse'
      summary: Архивировать кампанию
      tags:
      - campaigns
  /api/campaigns/{id}/restore:
    patch:
      parameters:
      - description: ID кампании
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RestoreCampaignResponse'
      summary: Восстановить кампанию из архива
      tags:
      - campaigns
  /api/campaigns/archive:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetAllCampaignsResponse'
      summary: Получить все архивированные кампании
      tags:
      - campaigns
  /api/clients:
