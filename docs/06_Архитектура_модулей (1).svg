
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" width="1500" height="940" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#37474f"/>
    </marker>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/></filter>
    <linearGradient id="L1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/><stop offset="100%" stop-color="#ffe082"/>
    </linearGradient>
    <linearGradient id="L2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/><stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="L3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/><stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="L4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e5f5"/><stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <linearGradient id="L5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/><stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="940" fill="#f8f7f4"/>

  <!-- Header -->
  <rect width="1500" height="56" fill="#1a237e"/>
  <rect y="44" width="1500" height="12" fill="#1a237e"/>
  <rect y="53" width="1500" height="3" fill="#ff6f00"/>
  <text x="36" y="36" fill="#fff" font-size="20" font-weight="800">Архитектура модулей «Конструктор HTML-рассылок (демо)»</text>
  <text x="36" y="78" fill="#666" font-size="12">Стек: React + TypeScript (UI) → Go (Backend REST API) → PostgreSQL 16 (DB) · 1С:Предприятие 8.3 — read-only клиент отчётности</text>

  <!-- ========================== L1 Frontend (React) ========================== -->
  <g filter="url(#sh)">
    <rect x="40" y="110" width="1420" height="120" rx="10" fill="url(#L1)" stroke="#f57f17" stroke-width="2"/>
    <text x="60" y="135" fill="#bf360c" font-size="14" font-weight="700">L1 · Frontend (React + TypeScript)</text>

    <rect x="60" y="150" width="220" height="70" rx="6" fill="#fff" stroke="#f57f17" stroke-width="1.5"/>
    <text x="170" y="174" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="700">UI-1 Auth/Register</text>
    <text x="170" y="194" text-anchor="middle" fill="#666" font-size="10">src/feature/Auth/...</text>
    <text x="170" y="210" text-anchor="middle" fill="#666" font-size="10">вход / регистрация</text>

    <rect x="295" y="150" width="220" height="70" rx="6" fill="#fff" stroke="#f57f17" stroke-width="1.5"/>
    <text x="405" y="174" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="700">UI-2 Templates</text>
    <text x="405" y="194" text-anchor="middle" fill="#666" font-size="10">HTML-редактор + предпросмотр</text>
    <text x="405" y="210" text-anchor="middle" fill="#666" font-size="10">desktop / mobile preview</text>

    <rect x="530" y="150" width="220" height="70" rx="6" fill="#fff" stroke="#f57f17" stroke-width="1.5"/>
    <text x="640" y="174" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="700">UI-3 Campaigns</text>
    <text x="640" y="194" text-anchor="middle" fill="#666" font-size="10">создание / запуск кампании</text>
    <text x="640" y="210" text-anchor="middle" fill="#666" font-size="10">привязка шаблона + сегмент</text>

    <rect x="765" y="150" width="220" height="70" rx="6" fill="#fff" stroke="#f57f17" stroke-width="1.5"/>
    <text x="875" y="174" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="700">UI-4 Delivery Log</text>
    <text x="875" y="194" text-anchor="middle" fill="#666" font-size="10">журнал доставки</text>
    <text x="875" y="210" text-anchor="middle" fill="#666" font-size="10">фильтры + экспорт CSV</text>

    <rect x="1000" y="150" width="220" height="70" rx="6" fill="#fff" stroke="#f57f17" stroke-width="1.5"/>
    <text x="1110" y="174" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="700">UI-5 KPI Report</text>
    <text x="1110" y="194" text-anchor="middle" fill="#666" font-size="10">сводный отчёт</text>
    <text x="1110" y="210" text-anchor="middle" fill="#666" font-size="10">разрезы + экспорт CSV</text>

    <rect x="1235" y="150" width="220" height="70" rx="6" fill="#fff" stroke="#f57f17" stroke-width="1.5"/>
    <text x="1345" y="174" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="700">UI-6 Admin</text>
    <text x="1345" y="194" text-anchor="middle" fill="#666" font-size="10">импорт CSV клиентов</text>
    <text x="1345" y="210" text-anchor="middle" fill="#666" font-size="10">настройки мока</text>
  </g>

  <!-- HTTPS arrow L1→L2 -->
  <g>
    <line x1="750" y1="240" x2="750" y2="290" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
    <text x="760" y="270" fill="#37474f" font-size="11" font-weight="600">HTTPS / JSON</text>
  </g>

  <!-- ========================== L2 Backend (Go) ========================== -->
  <g filter="url(#sh)">
    <rect x="40" y="300" width="1420" height="170" rx="10" fill="url(#L2)" stroke="#1565c0" stroke-width="2"/>
    <text x="60" y="325" fill="#0d47a1" font-size="14" font-weight="700">L2 · Backend (Go) — REST API + бизнес-логика + слой доступа к данным</text>

    <!-- L2a: API Layer -->
    <rect x="60" y="340" width="220" height="60" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
    <text x="170" y="365" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">API-1 · Auth Handler</text>
    <text x="170" y="385" text-anchor="middle" fill="#666" font-size="10">/api/auth/login, /api/auth/register</text>

    <rect x="295" y="340" width="220" height="60" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
    <text x="405" y="365" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">API-2 · Template Handler</text>
    <text x="405" y="385" text-anchor="middle" fill="#666" font-size="10">/api/templates CRUD</text>

    <rect x="530" y="340" width="220" height="60" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
    <text x="640" y="365" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">API-3 · Campaign Handler</text>
    <text x="640" y="385" text-anchor="middle" fill="#666" font-size="10">/api/campaigns + /start</text>

    <rect x="765" y="340" width="220" height="60" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
    <text x="875" y="365" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">API-4 · Report Handler</text>
    <text x="875" y="385" text-anchor="middle" fill="#666" font-size="10">/api/reports/kpi · /api/exports/csv</text>

    <rect x="1000" y="340" width="220" height="60" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
    <text x="1110" y="365" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">API-5 · Import Handler</text>
    <text x="1110" y="385" text-anchor="middle" fill="#666" font-size="10">/api/import/clients (CSV)</text>

    <rect x="1235" y="340" width="220" height="60" rx="6" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
    <text x="1345" y="365" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">API-6 · Admin Handler</text>
    <text x="1345" y="385" text-anchor="middle" fill="#666" font-size="10">/api/admin/mock-config</text>

    <!-- L2b: Service Layer -->
    <rect x="60" y="410" width="280" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="200" y="430" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">SVC · DeliveryService</text>
    <text x="200" y="448" text-anchor="middle" fill="#666" font-size="10">SendBatch + идемпотентность + retry</text>

    <rect x="355" y="410" width="280" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="495" y="430" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">SVC · ValidationService</text>
    <text x="495" y="448" text-anchor="middle" fill="#666" font-size="10">5 валидаторов (email, consent, segment, FK, status)</text>

    <rect x="650" y="410" width="280" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="790" y="430" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">SVC · ReportService</text>
    <text x="790" y="448" text-anchor="middle" fill="#666" font-size="10">BuildKpiReport · ExportCsv</text>

    <rect x="945" y="410" width="280" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="1085" y="430" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">SVC · ImportService</text>
    <text x="1085" y="448" text-anchor="middle" fill="#666" font-size="10">CSV-парсинг + bulk INSERT</text>

    <rect x="1240" y="410" width="220" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="1350" y="430" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="700">DAL · pgx (Go ↔ PG)</text>
    <text x="1350" y="448" text-anchor="middle" fill="#666" font-size="10">connection pool · prepared</text>
  </g>

  <!-- L2 → L3 -->
  <g>
    <line x1="500" y1="480" x2="500" y2="540" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
    <text x="510" y="515" fill="#37474f" font-size="11" font-weight="600">SQL (pgx)</text>
  </g>
  <g>
    <line x1="1100" y1="480" x2="1100" y2="540" stroke="#bf360c" stroke-width="2" marker-end="url(#arr)"/>
    <text x="1110" y="515" fill="#bf360c" font-size="11" font-weight="600">HTTP (мок)</text>
  </g>

  <!-- ========================== L3 Storage (PostgreSQL) ========================== -->
  <g filter="url(#sh)">
    <rect x="40" y="550" width="900" height="180" rx="10" fill="url(#L3)" stroke="#2e7d32" stroke-width="2"/>
    <text x="60" y="575" fill="#1b5e20" font-size="14" font-weight="700">L3 · Хранилище данных — PostgreSQL 16 (master)</text>

    <rect x="60" y="590" width="180" height="60" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="150" y="615" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="700">DB-1 · clients</text>
    <text x="150" y="633" text-anchor="middle" fill="#666" font-size="10">id, email, segment, consent_flag</text>

    <rect x="255" y="590" width="180" height="60" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="345" y="615" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="700">DB-2 · templates</text>
    <text x="345" y="633" text-anchor="middle" fill="#666" font-size="10">id, name, html_body</text>

    <rect x="450" y="590" width="180" height="60" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="540" y="615" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="700">DB-3 · campaigns</text>
    <text x="540" y="633" text-anchor="middle" fill="#666" font-size="10">id, tpl_id, segment, status</text>

    <rect x="645" y="590" width="180" height="60" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="735" y="615" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="700">DB-4 · delivery_log</text>
    <text x="735" y="633" text-anchor="middle" fill="#666" font-size="10">id, camp_id, client_id, status, ts</text>

    <rect x="60" y="660" width="180" height="60" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="150" y="685" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="700">DB-5 · users</text>
    <text x="150" y="703" text-anchor="middle" fill="#666" font-size="10">id, login, role</text>

    <rect x="255" y="660" width="380" height="60" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="445" y="685" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="700">DB-6 · template_changes_log</text>
    <text x="445" y="703" text-anchor="middle" fill="#666" font-size="10">id, tpl_id, old_html, new_html, changed_by, changed_at</text>

    <rect x="645" y="660" width="180" height="60" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="735" y="685" text-anchor="middle" fill="#1b5e20" font-size="12" font-weight="700">Indexes / Constraints</text>
    <text x="735" y="703" text-anchor="middle" fill="#666" font-size="10">CHECK, UNIQUE, FK, idx</text>
  </g>

  <!-- ========================== L4 Mock Service (отдельный) ========================== -->
  <g filter="url(#sh)">
    <rect x="970" y="550" width="490" height="180" rx="10" fill="url(#L5)" stroke="#bf360c" stroke-width="2"/>
    <text x="990" y="575" fill="#bf360c" font-size="14" font-weight="700">L4 · Внешний REST-мок отправки (Go)</text>

    <rect x="990" y="595" width="220" height="70" rx="6" fill="#fff" stroke="#bf360c" stroke-width="1.5"/>
    <text x="1100" y="620" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="700">MOCK · /mail/send</text>
    <text x="1100" y="640" text-anchor="middle" fill="#666" font-size="10">{camp_id, client_id, request_id}</text>
    <text x="1100" y="656" text-anchor="middle" fill="#666" font-size="10">→ {status: sent | failed}</text>

    <rect x="1225" y="595" width="220" height="70" rx="6" fill="#fff" stroke="#bf360c" stroke-width="1.5"/>
    <text x="1335" y="620" text-anchor="middle" fill="#bf360c" font-size="12" font-weight="700">MOCK config</text>
    <text x="1335" y="640" text-anchor="middle" fill="#666" font-size="10">failed_probability = const</text>
    <text x="1335" y="656" text-anchor="middle" fill="#666" font-size="10">локальный бинарь</text>

    <rect x="990" y="675" width="455" height="40" rx="6" fill="#fff" stroke="#bf360c" stroke-width="1.5"/>
    <text x="1217" y="700" text-anchor="middle" fill="#bf360c" font-size="11" font-weight="600">Идемпотентность по request_id (in-memory кэш отвечавших значений)</text>
  </g>

  <!-- ========================== L5 1С Reporting (read-only) ========================== -->
  <g filter="url(#sh)">
    <rect x="40" y="760" width="1420" height="130" rx="10" fill="url(#L4)" stroke="#6a1b9a" stroke-width="2"/>
    <text x="60" y="785" fill="#4a148c" font-size="14" font-weight="700">L5 · 1С:Предприятие 8.3 — клиент отчётности (read-only поверх PostgreSQL)</text>

    <rect x="60" y="800" width="280" height="70" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="200" y="825" text-anchor="middle" fill="#4a148c" font-size="12" font-weight="700">RPT-1 · Внешние источники данных</text>
    <text x="200" y="843" text-anchor="middle" fill="#666" font-size="10">External Data Source → PostgreSQL</text>
    <text x="200" y="859" text-anchor="middle" fill="#666" font-size="10">user: reports_user · GRANT SELECT</text>

    <rect x="355" y="800" width="280" height="70" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="495" y="825" text-anchor="middle" fill="#4a148c" font-size="12" font-weight="700">RPT-2 · Отчёт «KPI рассылок»</text>
    <text x="495" y="843" text-anchor="middle" fill="#666" font-size="10">SELECT с агрегацией по delivery_log</text>
    <text x="495" y="859" text-anchor="middle" fill="#666" font-size="10">разрезы: сегмент, кампания</text>

    <rect x="650" y="800" width="280" height="70" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="790" y="825" text-anchor="middle" fill="#4a148c" font-size="12" font-weight="700">RPT-3 · Отчёт «Журнал доставки»</text>
    <text x="790" y="843" text-anchor="middle" fill="#666" font-size="10">детализация по camp_id</text>
    <text x="790" y="859" text-anchor="middle" fill="#666" font-size="10">фильтры: статус, дата, сегмент</text>

    <rect x="945" y="800" width="280" height="70" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="1085" y="825" text-anchor="middle" fill="#4a148c" font-size="12" font-weight="700">RPT-4 · Отчёт «История шаблонов»</text>
    <text x="1085" y="843" text-anchor="middle" fill="#666" font-size="10">SELECT FROM template_changes_log</text>
    <text x="1085" y="859" text-anchor="middle" fill="#666" font-size="10">аудит изменений HTML</text>

    <rect x="1240" y="800" width="220" height="70" rx="6" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="1350" y="825" text-anchor="middle" fill="#4a148c" font-size="12" font-weight="700">RPT-5 · Печать / экспорт</text>
    <text x="1350" y="843" text-anchor="middle" fill="#666" font-size="10">PDF, Excel, CSV</text>
    <text x="1350" y="859" text-anchor="middle" fill="#666" font-size="10">из 1С штатными средствами</text>
  </g>

  <!-- L3 → L5 (read-only) -->
  <g>
    <path d="M 800 730 L 800 750" fill="none" stroke="#6a1b9a" stroke-width="2" marker-end="url(#arr)"/>
    <text x="810" y="745" fill="#6a1b9a" font-size="11" font-weight="600">SELECT only (read-only)</text>
  </g>

  <!-- Footer -->
  <text x="36" y="918" fill="#666" font-size="11" font-style="italic">Архитектура · Версия 1.1 · 1С отделён в read-only слой отчётности; вся транзакционная нагрузка — Go + PostgreSQL · Кейс 13</text>
</svg>
