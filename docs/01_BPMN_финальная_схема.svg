
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 520" width="1750" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#546e7a"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="taskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#c5cae9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1750" height="520" fill="#f8f7f4" rx="12"/>

  <!-- Header -->
  <rect width="1750" height="56" fill="url(#headerGrad)" rx="12"/>
  <rect y="44" width="1750" height="12" fill="url(#headerGrad)"/>
  <rect y="53" width="1750" height="3" fill="#ff6f00"/>
  <text x="36" y="36" fill="#fff" font-size="20" font-weight="800" letter-spacing="0.5">BPMN — Кейс 13: Конструктор HTML-рассылок</text>

  <!-- Legend -->
  <g transform="translate(36, 76)">
    <circle cx="8" cy="8" r="7" fill="#4CAF50" stroke="#2e7d32" stroke-width="2"/>
    <text x="22" y="12" fill="#546e7a" font-size="10">Событие</text>
    <rect x="90" y="1" width="16" height="14" rx="3" fill="url(#taskGrad)" stroke="#1565c0" stroke-width="1.5"/>
    <text x="112" y="12" fill="#546e7a" font-size="10">Задача</text>
    <rect x="165" y="1" width="16" height="14" rx="3" fill="url(#subGrad)" stroke="#283593" stroke-width="2.5"/>
    <text x="187" y="12" fill="#546e7a" font-size="10">Подпроцесс</text>
    <rect x="272" y="-2" width="14" height="14" rx="2" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5" transform="rotate(45 279 5)"/>
    <text x="300" y="12" fill="#546e7a" font-size="10">Шлюз</text>
  </g>

  <!-- ===== EDGES (arrows) ===== -->
  <!-- Start → Создать шаблон -->
  <line x1="88" y1="270" x2="140" y2="270" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Создать шаблон → Промежуточное -->
  <line x1="280" y1="270" x2="317" y2="270" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Промежуточное → Создать кампанию -->
  <line x1="345" y1="270" x2="380" y2="270" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Создать кампанию → Шлюз Валидация -->
  <line x1="520" y1="270" x2="555" y2="270" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Валидация → Да → Выбрать сегмент -->
  <line x1="599" y1="270" x2="640" y2="270" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618" y="262" fill="#2e7d32" font-size="11" font-weight="700" text-anchor="middle">Да</text>
  <!-- Валидация → Нет → ОТКАЗ -->
  <line x1="577" y1="292" x2="577" y2="408" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="350" fill="#d32f2f" font-size="11" font-weight="700">Нет</text>
  <!-- Выбрать сегмент → Шлюз И (split) -->
  <line x1="780" y1="270" x2="818" y2="270" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- AND split → Мок-отправка (вверх) -->
  <path d="M840,248 L840,200 L890,200" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- AND split → Логирование (вниз) -->
  <path d="M840,292 L840,340 L890,340" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Мок-отправка → AND join -->
  <path d="M1050,200 L1090,200 L1090,248" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Логирование → AND join -->
  <path d="M1050,340 L1090,340 L1090,292" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- AND join → Шлюз Ретрай -->
  <line x1="1112" y1="270" x2="1155" y2="270" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Ретрай → OK → Экспорт -->
  <line x1="1199" y1="270" x2="1250" y2="270" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1224" y="262" fill="#2e7d32" font-size="11" font-weight="700" text-anchor="middle">OK</text>
  <!-- Ретрай → failed → loop back to Мок-отправка -->
  <path d="M1177,248 L1177,140 L970,140 L970,175" fill="none" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="1080" y="133" fill="#d32f2f" font-size="11" font-weight="700" text-anchor="middle">failed</text>
  <!-- Экспорт → Закрыть кампанию -->
  <line x1="1390" y1="270" x2="1430" y2="270" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Закрыть кампанию → КОНЕЦ -->
  <line x1="1570" y1="270" x2="1610" y2="270" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== NODES ===== -->

  <!-- START -->
  <circle cx="70" cy="270" r="18" fill="#4CAF50" stroke="#2e7d32" stroke-width="3" filter="url(#shadow)"/>
  <text x="70" y="306" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="700">СТАРТ</text>

  <!-- Создать HTML-шаблон -->
  <rect x="140" y="245" width="140" height="50" rx="8" fill="url(#taskGrad)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="265" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="600">Создать</text>
  <text x="210" y="281" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="600">HTML-шаблон</text>

  <!-- Промежуточное событие: Шаблон готов -->
  <circle cx="331" cy="270" r="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
  <circle cx="331" cy="270" r="10" fill="none" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="331" y="300" text-anchor="middle" fill="#ef6c00" font-size="9" font-weight="600">Шаблон</text>
  <text x="331" y="312" text-anchor="middle" fill="#ef6c00" font-size="9" font-weight="600">готов</text>

  <!-- Создать кампанию -->
  <rect x="380" y="245" width="140" height="50" rx="8" fill="url(#taskGrad)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="265" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="600">Создать</text>
  <text x="450" y="281" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="600">кампанию</text>

  <!-- Шлюз XOR: Валидация -->
  <rect x="555" y="248" width="44" height="44" rx="3" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5" transform="rotate(45 577 270)" filter="url(#shadow)"/>
  <text x="577" y="274" text-anchor="middle" fill="#e65100" font-size="22" font-weight="900">×</text>
  <text x="577" y="232" text-anchor="middle" fill="#e65100" font-size="10" font-weight="700">Валидация</text>
  <text x="577" y="244" text-anchor="middle" fill="#e65100" font-size="10" font-weight="700">(≥5 правил)</text>

  <!-- ОТКАЗ (end event) -->
  <circle cx="577" cy="430" r="18" fill="#d32f2f" stroke="#b71c1c" stroke-width="4"/>
  <text x="577" y="464" text-anchor="middle" fill="#d32f2f" font-size="10" font-weight="700">ОТКАЗ</text>

  <!-- Выбрать сегмент -->
  <rect x="640" y="245" width="140" height="50" rx="8" fill="url(#taskGrad)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="710" y="265" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="600">Выбрать</text>
  <text x="710" y="281" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="600">сегмент</text>

  <!-- Шлюз AND (split) -->
  <rect x="818" y="248" width="44" height="44" rx="3" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5" transform="rotate(45 840 270)" filter="url(#shadow)"/>
  <text x="840" y="275" text-anchor="middle" fill="#e65100" font-size="24" font-weight="900">+</text>

  <!-- Мок-отправка (подпроцесс) -->
  <rect x="890" y="175" width="160" height="55" rx="8" fill="url(#subGrad)" stroke="#283593" stroke-width="3" filter="url(#shadow)"/>
  <text x="970" y="198" text-anchor="middle" fill="#1a237e" font-size="12" font-weight="600">Мок-отправка</text>
  <text x="970" y="214" text-anchor="middle" fill="#1a237e" font-size="12" font-weight="600">/mail/send</text>
  <rect x="964" y="218" width="12" height="9" rx="2" fill="none" stroke="#283593" stroke-width="1.5"/>

  <!-- Логировать result (подпроцесс) -->
  <rect x="890" y="315" width="160" height="55" rx="8" fill="url(#subGrad)" stroke="#283593" stroke-width="3" filter="url(#shadow)"/>
  <text x="970" y="338" text-anchor="middle" fill="#1a237e" font-size="12" font-weight="600">Логировать</text>
  <text x="970" y="354" text-anchor="middle" fill="#1a237e" font-size="12" font-weight="600">result</text>
  <rect x="964" y="358" width="12" height="9" rx="2" fill="none" stroke="#283593" stroke-width="1.5"/>

  <!-- Шлюз AND (join) -->
  <rect x="1068" y="248" width="44" height="44" rx="3" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5" transform="rotate(45 1090 270)" filter="url(#shadow)"/>
  <text x="1090" y="275" text-anchor="middle" fill="#e65100" font-size="24" font-weight="900">+</text>

  <!-- Шлюз XOR: Ретрай? -->
  <rect x="1155" y="248" width="44" height="44" rx="3" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5" transform="rotate(45 1177 270)" filter="url(#shadow)"/>
  <text x="1177" y="274" text-anchor="middle" fill="#e65100" font-size="22" font-weight="900">×</text>
  <text x="1177" y="232" text-anchor="middle" fill="#e65100" font-size="10" font-weight="700">Ретрай?</text>

  <!-- Экспорт CSV/отчёт -->
  <rect x="1250" y="245" width="140" height="50" rx="8" fill="url(#taskGrad)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1320" y="265" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="600">Экспорт</text>
  <text x="1320" y="281" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="600">CSV / отчёт</text>

  <!-- Закрыть кампанию -->
  <rect x="1430" y="245" width="140" height="50" rx="8" fill="url(#taskGrad)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1500" y="265" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="600">Закрыть</text>
  <text x="1500" y="281" text-anchor="middle" fill="#0d47a1" font-size="12" font-weight="600">кампанию</text>

  <!-- END -->
  <circle cx="1630" cy="270" r="18" fill="#d32f2f" stroke="#b71c1c" stroke-width="4" filter="url(#shadow)"/>
  <text x="1630" y="302" text-anchor="middle" fill="#b71c1c" font-size="9" font-weight="700">КОНЕЦ</text>
  <text x="1630" y="314" text-anchor="middle" fill="#b71c1c" font-size="9" font-weight="700">ПРОЦЕССА</text>

  <!-- Annotations -->
  <text x="210" y="238" text-anchor="middle" fill="#78909c" font-size="9" font-style="italic">[Функция]</text>
  <text x="450" y="238" text-anchor="middle" fill="#78909c" font-size="9" font-style="italic">[Функция]</text>
  <text x="970" y="168" text-anchor="middle" fill="#78909c" font-size="9" font-style="italic">[Вложенный подпроцесс]</text>
  <text x="970" y="385" text-anchor="middle" fill="#78909c" font-size="9" font-style="italic">[Вложенный подпроцесс]</text>
  <text x="840" y="310" text-anchor="middle" fill="#78909c" font-size="9" font-style="italic">[Операция И]</text>
  <text x="577" y="220" text-anchor="middle" fill="#78909c" font-size="9" font-style="italic">[Операция ИЛИ]</text>
  <text x="1177" y="220" text-anchor="middle" fill="#78909c" font-size="9" font-style="italic">[Операция ИЛИ]</text>
</svg>
