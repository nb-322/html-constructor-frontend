services:
  db:
    image: postgres:15-alpine

    container_name: opd_db

    restart: always

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_PORT}:5432"
    
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - 1c_network

  1c:
    image: teraproger/1c:latest
    container_name: opd_1c
    restart: unless-stopped
    command:
      - "/opt/1cv8/x86_64/8.3.26.1656/ibsrv"
      - "--db-path=/base"
      - "--name=training"
      - "--http-port=8888"
      - "--http-address=any"
      - "--config=/base/ibsrv.json"
    ports:
      - "8888:8888"
    volumes:
      - ./1c/InfoBase1:/base
    networks:
      - 1c_network
    depends_on:
      - db

networks:
  1c_network:
    driver: bridge

volumes:
  pgdata: