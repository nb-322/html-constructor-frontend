services:
  db:
    image: postgres:15-alpine
    container_name: opd_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - 1c_network

  redis:
    image: redis:7.2-alpine
    container_name: opd_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - 1c_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opd_api
    restart: always
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      - db
      - redis
    networks:
      - 1c_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opd_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - api
    networks:
      - 1c_network

  1c:
    image: teraproger/1c:latest
    container_name: opd_1c
    restart: unless-stopped
    command:
      - "/opt/1cv8/x86_64/8.3.26.1656/ibsrv"
      - "--db-path=/base"
      - "--name=training"
      - "--http-port=8888"
      - "--http-address=any"
      - "--config=/base/ibsrv.json"
    ports:
      - "8888:8888"
    volumes:
      - ./1c/InfoBase1:/base
    networks:
      - 1c_network
    depends_on:
      - db

networks:
  1c_network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
